name: Godot mobile prototype

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/godot-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/godot-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preserve existing deterministic web prototype tests
        run: npm test

      - name: Download Godot 4.7.2 stable
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Parse Godot project headlessly
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path mobile --editor --quit

      - name: Run Godot deterministic core tests
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path mobile --script res://tests/run_tests.gd

      - name: Launch portrait scene smoke
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path mobile --quit-after 2
